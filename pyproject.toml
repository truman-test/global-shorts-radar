[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "global-shorts-radar"
version = "0.1.0"
description = "Content intelligence radar: detect outlier global digital Shorts and surface original Korean story opportunities."
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]
produce = ["pillow>=10", "imageio-ffmpeg>=0.5", "edge-tts>=7"]

[project.scripts]
radar = "radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
