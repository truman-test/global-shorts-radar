[production]
# supertonic = Supertonic 3, local open weights (OpenRAIL-M: commercial OK, disclose AI voice): publishable, free
# edge       = Microsoft Edge voice via edge-tts: LOCAL PREVIEW ONLY (never licensed for commercial use)
# google     = Google Cloud Text-to-Speech (GOOGLE_TTS_API_KEY in .env): publishable, 1M chars/month free
engine = "remotion"        # remotion = animated scenes (video/ project, Node.js); ffmpeg = static cards fallback
backend = "supertonic"
supertonic_voice = "F1"        # F1-F5, M1-M5 (built-in voices; no cloning)
supertonic_speed = 1.2
supertonic_steps = 16
tts_python = ".venv-tts/Scripts/python.exe"   # Python 3.12 venv with `supertonic` installed
edge_voice = "ko-KR-SunHiNeural"
edge_rate = "+15%"
google_voice = "ko-KR-Neural2-A"
google_rate = 1.15
out_dir = "media"
transition = "continuity"   # Remotion scene changes: continuity (icon/avatar morphs into the next scene) | classic (slide/fade)
