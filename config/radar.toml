# Global Shorts Radar configuration.
# Weights are a starting hypothesis, not truth. Change them as real performance data arrives
# and bump `weights_version` so stored scores remain traceable.

[collect]
# Each keyword x region costs one search.list call = 100 quota units (free tier: 10,000/day).
keywords = [
  "AI scam",
  "phone spyware",
  "data breach",
  "weird technology",
  "internet mystery",
]
regions = ["US"]
# Seed channels: recent uploads of these channel ids become candidates too (channels.list +
# playlistItems.list + videos.list = ~3 units per channel, no search). Empty = keywords only.
# Filled on 2026-10-08 by `radar suggest-seeds` (rule: a ranked candidate scoring >= 45 with
# channel_fit >= 0.6, Indian channels already excluded). Review and edit freely.
seed_channels = [
  "UChsrqFLf9541GEaMGhIWfZw",  # Diyo Kids TV [US] 1,810 subs · best 61.4 · fit 0.8 · Would Your Kid Tap It? Uncle Himal on AI, Scams an
  "UC8UpR3jUos1jnEJQlzZ-idw",  # Ahmed Khanji [--] 554 subs · best 56.1 · fit 0.9 · How they spy on your phone and devices
  "UCE7spuKzxP1k8A-XucxxUAQ",  # John Casterline [US] 8,370,000 subs · best 53.7 · fit 0.8 · Insane AirBNB AI Scam 😭
  "UCCaqZuf3oz-xd7Ut4LWY8dA",  # Oddly Told [ES] 4,000 subs · best 53.1 · fit 0.9 · Why Families Now Have a Secret Password
  "UCEUe1bPnLYjjgLz2RZAmdeg",  # Joanna Jewell [ZA] 560,000 subs · best 52.2 · fit 0.8 · The terrifying AI scam every parent must know abou
  "UCZaT_X_mc0BI-djXOlfhqWQ",  # VICE News [US] 9,300,000 subs · best 49.1 · fit 0.8 · They used AI to clone his boss's face.
]
relevance_language = "en"      # search.list relevanceLanguage; regionCode alone does not filter by language
# Opt-in: drop candidates whose channel country (observed, channels.country) is listed. Empty = keep all.
# Channels without a country (~25% in live runs) are always kept.
exclude_channel_countries = ["IN"]   # on since 2026-10-08 (user decision): live runs #1-#4 were dominated by Indian-channel content
max_results_per_query = 25
published_within_hours = 168        # only discover videos from the last 7 days
recent_uploads_per_channel = 20     # size of channel baseline sample (and of a seed channel's observed uploads)
quota_budget = 2000                 # hard stop for estimated units per run
candidate_window_hours = 72         # candidates stay on the radar (and get re-tracked) this long after discovery

[metrics]
max_short_seconds = 180             # Shorts may be up to 3 minutes
min_baseline_videos = 3             # fewer -> outlier ratio is not computed
baseline_min_age_hours = 48         # very new uploads are excluded from the channel median
min_baseline_median_views = 1000    # outlier ratio uses max(channel median, this): tiny channels are not 100x outliers
freshness_half_life_hours = 48

[scoring]
weights_version = "v0.1-live"      # v0-spec + velocity_cap 100k -> 10k after the first live run (2026-10-08)
outlier_cap = 50.0                  # outlier ratio at/above this normalizes to 1.0 (log scale)
velocity_cap = 10000.0              # views/hour at/above this normalizes to 1.0 (log scale); live p90 was ~2.3k, max ~35k

[scoring.weights]
outlier_ratio = 25
view_velocity = 20
freshness = 10
story_strength = 15
korea_localization_gap = 15
localization_potential = 10
channel_fit = 5

[report]
top_n = 20

# Candidate filters, applied after scoring (ranking, Korea gap targets, reports). Deliberately
# loose: the point of v0 is to observe the data, not to hide it.
[filter]
max_age_hours = 240          # drop candidates older than this at report time
min_views = 100              # drop near-zero-view candidates
min_outlier_ratio = 0.0      # 0 = keep candidates with no computable or low outlier ratio
min_radar_score = 0.0
topic_categories = []        # e.g. ["scam", "ai"]: title/description must match a term of a listed [lexicon.topics] category
# Uploads found ONLY through a seed channel (not by any keyword) must have a term from any
# [lexicon.topics] category in the TITLE (descriptions are channel boilerplate); keyword hits are
# topical by construction, seed uploads are not.
seed_uploads_need_topic_match = true

# Topic lexicon used by the heuristic_v0 channel-fit judgment. Categories are a lens, not a fence.
[lexicon.topics]
ai = ["ai", "artificial intelligence", "chatgpt", "gpt", "deepfake", "voice clone", "voice cloning", "robot", "algorithm", "llm"]
scam = ["scam", "scammer", "scammers", "fraud", "phishing", "fake", "con", "stole", "stolen", "smishing"]
cybercrime = ["hacker", "hackers", "hacked", "hack", "malware", "ransomware", "breach", "leak", "leaked", "cybercrime"]
smartphone = ["phone", "iphone", "android", "smartphone", "battery", "sim", "charger", "airtag", "samsung", "galaxy", "pixel", "oppo", "xiaomi"]
apps_social = ["app", "apps", "tiktok", "instagram", "youtube", "whatsapp", "telegram", "social media", "account"]
privacy = ["privacy", "tracking", "tracked", "password", "passwords", "camera", "microphone", "location", "data"]
strange_tech = ["weird", "strange", "mystery", "creepy", "glitch", "bug", "failure", "future", "invention"]
internet = ["internet", "online", "website", "viral", "wifi", "email", "browser"]

# Terms that make a story hard to localize to Korea (US-specific systems/brands).
[lexicon.region_specific]
terms = ["irs", "social security", "zelle", "venmo", "cash app", "cashapp", "medicare", "dmv", "401k", "credit score", "walmart", "usps", "ssn"]

# Topics that travel well to Korean audiences.
[lexicon.universal]
terms = ["phone", "iphone", "android", "ai", "scam", "password", "hacker", "hacked", "camera", "deepfake", "voice", "battery", "app", "privacy", "wifi", "message", "text"]

# Minimal EN->KO term map for the opt-in Korea gap check (search in Korean on KR region).
[lexicon.korean_terms]
