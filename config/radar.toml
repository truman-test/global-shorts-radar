# Global Shorts Radar configuration.
# Weights are a starting hypothesis, not truth. Change them as real performance data arrives
# and bump `weights_version` so stored scores remain traceable.

[collect]
# Each keyword x region costs one search.list call = 100 quota units (free tier: 10,000/day).
keywords = [
  "AI scam",
  "phone hacked",
  "cybercrime",
  "deepfake",
  "weird technology",
  "internet mystery",
]
regions = ["US"]
relevance_language = "en"      # search.list relevanceLanguage; regionCode alone does not filter by language
max_results_per_query = 25
published_within_hours = 168        # only discover videos from the last 7 days
recent_uploads_per_channel = 15     # size of channel baseline sample
quota_budget = 2000                 # hard stop for estimated units per run
candidate_window_hours = 72         # candidates stay on the radar (and get re-tracked) this long after discovery

[metrics]
max_short_seconds = 180             # Shorts may be up to 3 minutes
min_baseline_videos = 3             # fewer -> outlier ratio is not computed
baseline_min_age_hours = 48         # very new uploads are excluded from the channel median
freshness_half_life_hours = 48

[scoring]
weights_version = "v0.1-live"      # v0-spec + velocity_cap 100k -> 10k after the first live run (2026-10-08)
outlier_cap = 50.0                  # outlier ratio at/above this normalizes to 1.0 (log scale)
velocity_cap = 10000.0              # views/hour at/above this normalizes to 1.0 (log scale); live p90 was ~2.3k, max ~35k

[scoring.weights]
outlier_ratio = 25
view_velocity = 20
freshness = 10
story_strength = 15
korea_localization_gap = 15
localization_potential = 10
channel_fit = 5

[report]
top_n = 20

# Topic lexicon used by the heuristic_v0 channel-fit judgment. Categories are a lens, not a fence.
[lexicon.topics]
ai = ["ai", "artificial intelligence", "chatgpt", "gpt", "deepfake", "voice clone", "voice cloning", "robot", "algorithm", "llm"]
scam = ["scam", "scammer", "scammers", "fraud", "phishing", "fake", "con", "stole", "stolen", "smishing"]
cybercrime = ["hacker", "hackers", "hacked", "hack", "malware", "ransomware", "breach", "leak", "leaked", "cybercrime"]
smartphone = ["phone", "iphone", "android", "smartphone", "battery", "sim", "charger", "airtag"]
apps_social = ["app", "apps", "tiktok", "instagram", "youtube", "whatsapp", "telegram", "social media", "account"]
privacy = ["privacy", "tracking", "tracked", "password", "passwords", "camera", "microphone", "location", "data"]
strange_tech = ["weird", "strange", "mystery", "creepy", "glitch", "bug", "failure", "future", "invention"]
internet = ["internet", "online", "website", "viral", "wifi", "email", "browser"]

# Terms that make a story hard to localize to Korea (US-specific systems/brands).
[lexicon.region_specific]
terms = ["irs", "social security", "zelle", "venmo", "cash app", "cashapp", "medicare", "dmv", "401k", "credit score", "walmart", "usps", "ssn"]

# Topics that travel well to Korean audiences.
[lexicon.universal]
terms = ["phone", "iphone", "android", "ai", "scam", "password", "hacker", "hacked", "camera", "deepfake", "voice", "battery", "app", "privacy", "wifi", "message", "text"]

